<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>ZNEXMODS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--b:#07070a;--s:rgba(20,20,26,.72);--bd:rgba(255,255,255,.08);--t:#fafafa;--m:#a1a1aa;--a:#6366f1;--a2:#8b5cf6;--ok:#22c55e;--tb:64px}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--b);color:var(--t);padding-top:calc(var(--tb) + env(safe-area-inset-top));min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg::before{content:'';position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 40%,#000 40%,transparent);mask-image:radial-gradient(ellipse 70% 55% at 50% 40%,#000 40%,transparent)}
.o{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.o1{width:620px;height:620px;background:radial-gradient(circle,#6366f1,transparent 65%);top:-260px;left:-180px;animation:a1 18s ease-in-out infinite}
.o2{width:560px;height:560px;background:radial-gradient(circle,#8b5cf6,transparent 65%);top:20%;right:-220px;animation:a2 22s ease-in-out infinite}
.o3{width:480px;height:480px;background:radial-gradient(circle,#22d3ee,transparent 65%);bottom:-220px;left:40%;opacity:.35;animation:a3 26s ease-in-out infinite}
@keyframes a1{50%{transform:translate(60px,40px) scale(1.1)}}
@keyframes a2{50%{transform:translate(-50px,60px) scale(1.15)}}
@keyframes a3{50%{transform:translate(40px,-50px) scale(1.1)}}
.hd{position:fixed;top:0;left:0;width:100%;height:calc(var(--tb) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:rgba(9,9,11,.6);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid var(--bd);z-index:2e3;display:flex;align-items:center;justify-content:center}
.hd::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;opacity:.7;background:linear-gradient(90deg,transparent,rgba(99,102,241,.5) 25%,rgba(139,92,246,.7) 50%,rgba(99,102,241,.5) 75%,transparent)}
.bd{font-weight:800;font-size:18px;letter-spacing:3.5px;user-select:none;background:linear-gradient(180deg,#fff,#c7c7d1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.w{position:relative;z-index:1;padding:40px 20px 80px;max-width:720px;margin:0 auto}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.h{text-align:center;padding:56px 24px 48px;position:relative;margin-bottom:28px;border-radius:24px;border:1px solid var(--bd);overflow:hidden;background:radial-gradient(ellipse at top,rgba(99,102,241,.1),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.02),transparent);animation:up .7s cubic-bezier(.22,1,.36,1) both}
.h::before{content:'';position:absolute;top:0;left:15%;right:15%;height:1px;background:linear-gradient(90deg,transparent,rgba(139,92,246,.8),transparent)}
.t1{font-size:34px;font-weight:800;letter-spacing:-1.2px;line-height:1.1;margin-bottom:14px}
.ac{background:linear-gradient(135deg,#818cf8,#c4b5fd 50%,#67e8f9);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh 6s ease infinite}
@keyframes sh{50%{background-position:100% center}}
.sb{color:var(--m);font-size:15px;max-width:460px;margin:0 auto;line-height:1.65}
.aw{display:flex;justify-content:center;width:100%;padding:0 16px;animation:up .7s cubic-bezier(.22,1,.36,1) .12s both}
.ab{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 14px 22px;border-radius:16px;width:100%;max-width:480px;border:1px solid transparent;background:linear-gradient(var(--s),var(--s)) padding-box,linear-gradient(135deg,rgba(99,102,241,.6),rgba(139,92,246,.2) 30%,rgba(255,255,255,.06) 50%,rgba(139,92,246,.2) 70%,rgba(34,211,238,.5)) border-box;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px -10px rgba(99,102,241,.35),inset 0 0 0 1px rgba(255,255,255,.02)}
.lb{color:var(--m);font-size:13px;font-weight:500;white-space:nowrap;flex-shrink:0}
.cd{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.15);padding:4px 4px 4px 14px;border-radius:10px;user-select:all;-webkit-user-select:all}
.ct{flex:1;min-width:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(90deg,#818cf8,#c4b5fd 40%,#a5f3fc 60%,#818cf8);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh 4s linear infinite}
.cp{position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:7px;border-radius:8px;cursor:pointer;overflow:hidden;color:#c7d2fe;background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.15));border:1px solid rgba(99,102,241,.3);transition:.2s;-webkit-tap-highlight-color:transparent}
.cp::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--a),var(--a2));opacity:0;transition:opacity .2s}
.cp:hover{border-color:transparent;color:#fff}
.cp:hover::before{opacity:1}
.cp svg{position:relative;z-index:1;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cp.ok{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.5);color:var(--ok)}
.cp.ok::before{opacity:0}
.ts{position:fixed;left:50%;bottom:32px;transform:translate(-50%,120%);z-index:3e3;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:12px;background:rgba(20,20,26,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(34,197,94,.4);color:#fafafa;font-size:14px;font-weight:500;box-shadow:0 20px 60px -15px rgba(0,0,0,.8),inset 0 0 0 1px rgba(34,197,94,.2);opacity:0;transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .4s}
.ts.on{transform:translate(-50%,0);opacity:1}
.ts i{width:22px;height:22px;border-radius:50%;background:rgba(34,197,94,.18);display:grid;place-items:center;flex-shrink:0;font-style:normal}
.ts svg{width:13px;height:13px;fill:none;stroke:var(--ok);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:640px){:root{--tb:60px}.bd{font-size:15px;letter-spacing:2.5px}.w{padding:24px 14px 64px}.h{padding:40px 18px 36px;margin-bottom:22px;border-radius:20px}.t1{font-size:26px;letter-spacing:-.8px}.sb{font-size:13.5px}.ab{flex-direction:column;align-items:stretch;gap:10px;padding:14px 16px}.lb{text-align:center}.cd{padding:4px 4px 4px 12px}.ct{font-size:13.5px}.o1,.o2{opacity:.4}.o3{display:none}}
@media(min-width:1024px){.h{padding:72px 40px 64px}.t1{font-size:44px;letter-spacing:-1.8px}.sb{font-size:16px}.ab{padding:16px 18px 16px 26px}.ct{font-size:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>
<div class="bg"><div class="o o1"></div><div class="o o2"></div><div class="o o3"></div></div>
<header class="hd"><div class="bd">ZNEXMODS</div></header>
<main class="w">
<section class="h">
<h1 class="t1">Chào mừng đến <span class="ac">ZNEXMODS</span></h1>
<p class="sb">Bạn lấy mã để trải nghiệm nhanh nhé. Cảm ơn bạn!</p>
</section>
<div class="aw"><div class="ab">
<span class="lb">Mã kích hoạt:</span>
<div class="cd">
<span class="ct" id="c">ZNEX-ANYCQX</span>
<button class="cp" id="b" aria-label="Sao chép"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></div></div></div></main>
<div class="ts" id="t" role="status"><i><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></i><span>Đã sao chép mã</span></div>
<script>
const b=document.getElementById('b'),c=document.getElementById('c'),t=document.getElementById('t'),ic='<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',id='<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>';
let t1,t2;
const ok=()=>{b.classList.add('ok');b.innerHTML=id;t.classList.add('on');clearTimeout(t1);clearTimeout(t2);t1=setTimeout(()=>t.classList.remove('on'),2200);t2=setTimeout(()=>{b.classList.remove('ok');b.innerHTML=ic},1600)};
const fb=x=>{const e=document.createElement('textarea');e.value=x;e.style.cssText='position:fixed;opacity:0';document.body.appendChild(e);e.select();try{document.execCommand('copy')}catch(_){}e.remove()};
b.onclick=()=>{const x=c.textContent.trim();if(navigator.clipboard&&isSecureContext)navigator.clipboard.writeText(x).then(ok).catch(()=>{fb(x);ok()});else{fb(x);ok()}};
</script></body></html>
